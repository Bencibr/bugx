<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#06090d"/>
    </linearGradient>
    <radialGradient id="ghostGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jellyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08b7d4"/>
      <stop offset="100%" stop-color="#7be6f7"/>
    </linearGradient>
        <mask id="hollowMask">
      <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
      <ellipse cx="206" cy="225" rx="20" ry="28"/>
      <ellipse cx="306" cy="225" rx="20" ry="28"/>
    </mask>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .wordmark { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
      .tagline { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGrad)"/>


  <!-- 光晕（居中于图形） -->
  <ellipse cx="400" cy="260" rx="260" ry="170" fill="url(#ghostGlow)"/>

  <!-- 幽灵（主体，居中偏左上） -->
  <g transform="translate(280,23.3) scale(0.95)" filter="url(#softGlow)" opacity="0.5">
    <path d="M 140 260
             C 140 150, 200 120, 256 120
             C 312 120, 372 150, 372 260
             C 372 280, 356 295, 340 280
             C 324 265, 308 265, 292 280
             C 276 295, 260 295, 244 280
             C 228 265, 212 265, 196 280
             C 180 295, 164 295, 148 280
             C 140 272, 140 265, 140 260 Z"
          fill="#7be6f7"/>
  </g>
  <g transform="translate(280,23.3) scale(0.95)">
    <path d="M 140 260
             C 140 150, 200 120, 256 120
             C 312 120, 372 150, 372 260
             C 372 280, 356 295, 340 280
             C 324 265, 308 265, 292 280
             C 276 295, 260 295, 244 280
             C 228 265, 212 265, 196 280
             C 180 295, 164 295, 148 280
             C 140 272, 140 265, 140 260 Z"
          fill="url(#jellyGrad)" mask="url(#hollowMask)"/>
  </g>

  <!-- Wordmark -->

  <!-- 双语标语 -->
  <text class="tagline" x="640" y="470" font-size="32" fill="#e6edf6" text-anchor="middle"><tspan fill="#7be6f7" font-weight="700">BugX</tspan> makes it easy to audit AI-written code.</text>
  <text class="tagline" x="640" y="530" font-size="24" fill="#8b9bb4" text-anchor="middle">让你轻松审计 AI 写的代码 · AI 代码审计 Agent</text>
  <text class="wordmark" x="580" y="300" font-size="150" fill="#ffffff" letter-spacing="-1">BugX</text>
</svg>
