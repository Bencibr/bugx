<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#06090d"/>
    </linearGradient>
    <radialGradient id="ghostGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jellyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08b7d4"/>
      <stop offset="100%" stop-color="#7be6f7"/>
    </linearGradient>
    <mask id="hollowMask">
      <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
      <ellipse cx="206" cy="225" rx="20" ry="28"/>
      <ellipse cx="306" cy="225" rx="20" ry="28"/>
    </mask>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .wordmark { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .tagline { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="400" fill="url(#bgGrad)"/>

  <!-- logo + wordmark 组合整体居中（幽灵 197 宽 + 间隙 44 + BugX 约 300 宽 = 541 → 起点 529） -->
  <ellipse cx="628" cy="150" rx="230" ry="140" fill="url(#ghostGlow)"/>

  <!-- 幽灵光晕层 -->
  <g transform="translate(402,-25) scale(0.85)" filter="url(#softGlow)" opacity="0.5">
    <path d="M 140 260
             C 140 150, 200 120, 256 120
             C 312 120, 372 150, 372 260
             C 372 280, 356 295, 340 280
             C 324 265, 308 265, 292 280
             C 276 295, 260 295, 244 280
             C 228 265, 212 265, 196 280
             C 180 295, 164 295, 148 280
             C 140 272, 140 265, 140 260 Z"
          fill="#7be6f7"/>
  </g>
  <!-- 幽灵主体 -->
  <g transform="translate(402,-25) scale(0.85)">
    <path d="M 140 260
             C 140 150, 200 120, 256 120
             C 312 120, 372 150, 372 260
             C 372 280, 356 295, 340 280
             C 324 265, 308 265, 292 280
             C 276 295, 260 295, 244 280
             C 228 265, 212 265, 196 280
             C 180 295, 164 295, 148 280
             C 140 272, 140 265, 140 260 Z"
          fill="url(#jellyGrad)" mask="url(#hollowMask)"/>
  </g>

  <!-- 文字标题 -->
  <text class="wordmark" x="766" y="188" font-size="118" fill="#ffffff" letter-spacing="-1">BugX</text>

  <!-- 中文 tagline -->
  <text class="tagline" x="800" y="300" font-size="35" fill="#e6edf6" text-anchor="middle"><tspan fill="#7be6f7" font-weight="700">BugX</tspan>，让你轻松审计 AI 写的代码。</text>

  <!-- 副行 -->
  <text class="tagline" x="800" y="348" font-size="20" fill="#8b9bb4" text-anchor="middle">装进你现有开发工具的 AI 审计助手，可以协助你实现代码审查、功能审查、性能审查。</text>
</svg>
