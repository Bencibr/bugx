[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bugx-cli"
version = "0.1.0"
description = "Evidence-driven AI code auditing, application security review, vulnerability hunting, and verified bug reproduction CLI for MCP/ACP coding agents"
keywords = [
  "AI code auditing",
  "application security",
  "security code review",
  "vulnerability hunting",
  "bug finding",
  "verified bug reproduction",
  "MCP",
  "ACP",
  "Python CLI",
  "Node.js CLI",
  "Claude Code",
  "OpenAI Codex",
  "OpenCode",
  "Cline",
]
readme = "docs/07_distribution/02_README_PYPI.md"
requires-python = ">=3.11"
license = "BUSL-1.1"
dependencies = []

[project.optional-dependencies]
tui = ["pexpect==4.9.0"]
graph = ["tree-sitter-language-pack==1.14.3"]
# 加密遥测包（flywheel 的 AES-GCM 往返）与 skill_pack 的 Ed25519 验签。
# 两者都是可选能力：缺失时降级/明确报错，不影响核心审计流程。
crypto = ["cryptography>=41"]

[project.scripts]
bugx = "bugx_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "interfaces/cli"}

[tool.setuptools.packages.find]
where = ["interfaces/cli"]
include = ["bugx_cli*"]

[tool.setuptools.data-files]
