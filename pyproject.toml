[tool.bugx]
node = ">=24,<27"
playwright-mcp = "0.0.79"
playwright-browser = "1.63.0-alpha-2026-08-05"
postmcp = "1.0.3"
agent-tty = "0.5.0"
pexpect = "4.9.0"
codebase-memory-mcp = "0.10.5"
ripgrep = "15.2.0"
ast-grep = "0.45.1"
jq = "1.8.2"
context7-mcp = "4.0.3"
github-mcp-server = "1.9.0"
schemathesis = "4.24.3"
restler = "9.3.1"
k6 = "2.2.0"
vegeta = "12.13.0"
conftest = "0.69.0"
actionlint = "1.7.12"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "scripts", "core", ".bugx", "worktrees", "ecosystem", "build", "dist"]
pythonpath = [".", "core", "interfaces/cli", "tests"]

[tool.coverage.run]
parallel = true
source = ["core", "interfaces/cli/bugx_cli"]
branch = true
omit = [
    "tests/*",
    ".bugx/*",
    "scripts/*",
]

[tool.coverage.report]
include = ["core/*.py", "interfaces/cli/bugx_cli/*.py"]
fail_under = 60

[tool.coverage.json]
output = ".coverage-report.json"
