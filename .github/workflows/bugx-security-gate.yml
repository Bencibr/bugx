name: BugX Continuous Security Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  pull-requests: write

jobs:
  security-audit:
    name: Orca 6-Worker Penetration Drill & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install BugX Agent
        run: |
          python -m pip install --upgrade pip
          pip install . --no-deps

      - name: Run BugX Security Gating
        run: |
          python3 scripts/ci_security_gate.py \
            --root . \
            --min-kill-rate 0.85 \
            --max-fp 0 \
            --concurrency 6 \
            --summary-out pr_security_summary.md

      - name: Archive Security Gate Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugx-security-evidence
          path: |
            pr_security_summary.md
            evals/oss/*.json
            evals/oss/*.md
