name: Upload BugX SARIF

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact containing findings.json from a real BugX audit
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs['artifact-name'] }}
          path: incoming
      - name: Validate and export real audit findings
        run: |
          test -f incoming/findings.json
          python - incoming/findings.json <<'PY'
          import json
          import sys
          from pathlib import Path

          findings = Path(sys.argv[1])
          incoming = findings.parent
          max_bytes = 10 * 1024 * 1024
          if findings.is_symlink() or not findings.is_file():
              raise SystemExit("findings.json must be a regular file")
          entries = list(incoming.rglob("*"))
          if any(entry.is_symlink() for entry in entries):
              raise SystemExit("artifact must not contain symbolic links")
          files = [entry for entry in entries if entry.is_file()]
          if files != [findings]:
              raise SystemExit(f"artifact must contain only {findings}")
          if findings.stat().st_size > max_bytes:
              raise SystemExit(f"findings.json exceeds {max_bytes} bytes")
          payload = json.loads(findings.read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or payload.get("schema_version") != 1:
              raise SystemExit("findings.json schema_version must be 1")
          PY
          python core/finding_report.py validate \
            --input incoming/findings.json --root .
          python core/finding_report.py export \
            --input incoming/findings.json --root . --format sarif \
            --output "$RUNNER_TEMP/bugx.sarif"
          python - "$RUNNER_TEMP/bugx.sarif" <<'PY'
          import json
          import sys
          from pathlib import Path

          sarif = Path(sys.argv[1])
          max_bytes = 20 * 1024 * 1024
          if sarif.stat().st_size > max_bytes:
              raise SystemExit(f"SARIF exceeds {max_bytes} bytes")
          payload = json.loads(sarif.read_text(encoding="utf-8"))
          if payload.get("version") != "2.1.0" or not isinstance(payload.get("runs"), list):
              raise SystemExit("invalid SARIF 2.1.0 document")
          PY
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: ${{ runner.temp }}/bugx.sarif
          category: bugx-agent
