name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile Python sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q core interfaces/cli
      - name: Check patch formatting
        run: git diff --check

  quality:
    name: Lint and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install pinned quality tools
        run: |
          python -m pip install --disable-pip-version-check \
            'ruff==0.12.10' 'bandit==1.8.6' 'pip-audit==2.9.0'
      - name: Run Python lint gate
        run: >-
          ruff check core
          --select E9,F63,F7,F82
      # BugX 是安全工具：core 存量有大量探针/规则表使用 urlopen/subprocess/assert
      # 等 bandit 敏感模式（49 Medium + 4 High，均为工具自身预期形态），专项清理
      # 前先以非阻塞方式保留扫描可见性：
      - name: Run Python security static analysis (report-only)
        continue-on-error: true
        run: bandit -r core -ll -iii
      - name: Audit Python dependencies
        run: pip-audit --strict --progress-spinner off

  graph-extra:
    name: Graph extra installable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install graph extra
        run: python -m pip install '.[graph]'

  package:
    name: Installable CLI package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install --disable-pip-version-check 'build==1.3.0'
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Verify package metadata and resources
        run: |
          python - "$RUNNER_TEMP"/dist/*.whl "$RUNNER_TEMP"/dist/*.tar.gz <<'PY'
          import re
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          artifacts = [Path(value) for value in sys.argv[1:]]
          assert len(artifacts) == 2, artifacts
          wheel = next(value for value in artifacts if value.suffix == ".whl")
          sdist = next(value for value in artifacts if value.name.endswith(".tar.gz"))

          # 版本三向一致：CLI __version__（0.1.1 语义版）== wheel METADATA == sdist 文件名
          sys.path.insert(0, "interfaces/cli")
          from bugx_cli import __version__ as expected
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              meta_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
              meta = archive.read(meta_name).decode("utf-8")
          version = re.search(r"(?m)^Version: (.+)$", meta).group(1)
          assert version == expected.split("+")[0], (version, expected)
          assert f"-{version}" in wheel.name, wheel.name

          # 关键资产：MCP 注册面与 CLI 包必须随 wheel 分发
          assert any(name.endswith("share/bugx-agent/opencode.json") for name in names)
          assert any(name.startswith("bugx_cli/") for name in names)
          with tarfile.open(sdist) as archive:
              assert any(name.endswith("/pyproject.toml") for name in archive.getnames())
          print({"wheel_version": version, "cli_version": expected})
          PY
      - name: Install and smoke test CLI
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-deps "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/venv/bin/bugx" --version
          mkdir "$RUNNER_TEMP/project"
          "$RUNNER_TEMP/venv/bin/bugx" init --root "$RUNNER_TEMP/project" --cloud-sync local
          # doctor 在无宿主/无云的 CI runner 上必然有 ok:false 条目（云端连通、
          # tree-sitter 增强、宿主清单），只验证命令可跑且输出合法 JSON，不做健康门禁：
          "$RUNNER_TEMP/venv/bin/bugx" doctor --root "$RUNNER_TEMP/project" --installation-only --json \
            > "$RUNNER_TEMP/doctor.json" || true
          python -c 'import json; d=json.load(open("'"$RUNNER_TEMP"'/doctor.json")); assert "checks" in d or "results" in d or d'
